<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cheema Academy - Student Dashboard</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f2f2f2;
        }

        .header {
            background: #333;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .dashboard {
            max-width: 900px;
            margin: 30px auto;
            padding: 20px;
        }

        .welcome {
            background: white;
            padding: 25px;
            border-radius: 15px;
            margin-bottom: 20px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 20px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .card h3 {
            margin-bottom: 10px;
        }

        .card p {
            color: #666;
        }

        .logout {
            margin-top: 25px;
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            background: #333;
            color: white;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <div class="header">
        <h1>Cheema Academy</h1>
        <p>Student Dashboard</p>
    </div>

    <div class="dashboard">

        <div class="welcome">
            <h2>Welcome, Student 👋</h2>
            <p>This is your personal Cheema Academy portal.</p>
        </div>

        <div class="cards">

            <div class="card">
    <h3>📊 Attendance</h3>
    <p id="attendanceStatus">Loading attendance...</p>
</div>

            <div class="card">
                <h3>📚 Notes</h3>
                <p>Your study notes will appear here.</p>
            </div>

            <div class="card">
                <h3>📝 Assignments</h3>
                <p>Assignments will appear here.</p>
            </div>

            <div class="card">
                <h3>📢 Announcements</h3>
                <p>Academy announcements will appear here.</p>
            </div>

        </div>

        <button onclick="logoutStudent()">Logout</button>

    </div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
    const supabaseUrl = "https://toweqgaxwfdelucmppor.supabase.co";
    const supabaseKey = "sb_publishable_OaraYTaahP5DUfi3eOgIpQ_nmP5IJvQ";

    const supabaseClient = supabase.createClient(
        supabaseUrl,
        supabaseKey
    );
   async function loadAttendance() {
    const attendanceStatus = document.getElementById("attendanceStatus");

    // Get the currently logged-in user
    const { data: { user }, error: userError } =
        await supabaseClient.auth.getUser();

    if (userError || !user) {
        attendanceStatus.textContent = "Please log in again.";
        return;
    }

    // Find the student using their login email
    const { data: student, error: studentError } =
        await supabaseClient
            .from("students")
            .select("id")
            .eq("email", user.email)
            .single();

    if (studentError || !student) {
        attendanceStatus.textContent = "Student record not found.";
        console.error(studentError);
        return;
    }

    // Load attendance only for this student
    const { data, error } = await supabaseClient
        .from("attendance")
        .select("*")
        .eq("student_id", student.id)
        .order("attendance_date", { ascending: false });

    if (error) {
        attendanceStatus.textContent = "Unable to load attendance.";
        console.error(error);
        return;
    }

    if (!data || data.length === 0) {
        attendanceStatus.textContent = "No attendance records found.";
        return;
    }

    const present = data.filter(record => record.status === "Present").length;
    const total = data.length;
    const percentage = Math.round((present / total) * 100);

    attendanceStatus.textContent =
        `${present} Present out of ${total} days (${percentage}%)`;
}
async function logoutStudent() {
    await supabaseClient.auth.signOut();
    window.location.href = "login.html";
}
loadAttendance();
</script>
</body>
</html>
